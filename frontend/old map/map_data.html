  else{if(s.cat==='land'&&s.fac!==fac&&!_sameCamp(fac,s.fac))return true;}}
 return false;}
function _shipBlock(k,fac){var st=_cellStacks(k),i;for(i=0;i<st.length;i++){var s=st[i];if(s.cat==='water'&&s.units.length&&_navEnemy(fac,s.fac))return true;}return false;} // 河川禦敵：敵艦(依關係)阻擋陸軍渡河
var _FORRAIL={'南滿鐵路':'日','中東鐵路':'蘇','滇越鐵路':'法'};
function _usableRail(k,fac){var ns=railKeys[k]||[],i;for(i=0;i<ns.length;i++){var p=_FORRAIL[ns[i]];if(!p)return true;/*中國鐵路人人可用*/if(POW2REL[fac]===p)return true;/*列強行駛自己陣營的鐵路*/var r=relOf(fac,p);if(typeof r==='number'&&r>=5)return true;}return false;}
function _narrow(k,fac){return fac!=='Y'&&cells[k]&&cells[k].prov==='山西';} // 山西窄軌：非晉系沿鐵過境 -1
// 回傳自 srcKey 可達之目標格集合（{key:true}）
function reachableSet(srcKey,fac,cat,seaOnly){var res={};seedForce();var q=[[srcKey,2]],seen={};seen[srcKey]=2;
 while(q.length){var cur=q.shift(),k=cur[0],rem=cur[1];if(rem<=0)continue;var cr=key2cr(k),nb=nbrs(cr[0],cr[1]),i;
  for(i=0;i<nb.length;i++){var nk=nb[i][0]+','+nb[i][1];if(!cells[nk])continue;
   if(!_passable(nk,cat,seaOnly))continue;if(_enemyOcc(nk,fac,cat))continue;
   if(cat==='land'&&!_isPort(nk)&&_shipBlock(nk,fac))continue; // 河川禦敵僅擋「渡河／過橋」；港口城市有陸有水，陸水分離：敵艦不擋陸軍進駐
   res[nk]=true;var rem2=rem-1;
   var cont=(cat==='water')||(cat==='land'&&_usableRail(k,fac)&&_usableRail(nk,fac)&&!_narrow(nk,fac));
   if(rem2>0&&cont&&(seen[nk]===undefined||seen[nk]<rem2)){seen[nk]=rem2;q.push([nk,rem2]);}}}
 delete res[srcKey];return res;}
// 還原移動路徑（≤2 格）：相鄰→[dst]；隔一格→[中繼,dst]
function _movePath(src,dst){var a=key2cr(src);var sn=nbrs(a[0],a[1]).map(function(n){return n[0]+','+n[1];});
 if(sn.indexOf(dst)>=0)return [dst];
 var b=key2cr(dst);var dn=nbrs(b[0],b[1]).map(function(n){return n[0]+','+n[1];});
 var mid=sn.filter(function(k){return cells[k]&&dn.indexOf(k)>=0;})[0];
 return mid?[mid,dst]:[dst];}
function _wrapLeaves(leaves){return buildOrg(leaves.map(function(l){return l.u;}));}
function _repositionGen(s,dstKey){if(!s||!s.cmd)return;var g=GEN.find(function(x){return x.n===s.cmd&&!x.dead;});if(g){var cr=key2cr(dstKey);g.id=key2id(dstKey);g._c=cr[0];g._r=cr[1];}}
function _recolorHex(key){if(typeof document==='undefined'||typeof gHex==='undefined')return;var poly=gHex.querySelector('polygon[data-key="'+key+'"]');if(!poly)return;var cc=cells[key];
 if(cc.river){poly.setAttribute('fill','#5b86a6');poly.setAttribute('fill-opacity','.5');}
 else if(cc.fac){poly.setAttribute('fill',R[cc.fac].c);poly.setAttribute('fill-opacity',cc.land?(R[cc.fac].g==='列強'?'.42':'.35'):'.26');}
 else if(garrByKey[key]){poly.setAttribute('fill',R[garrByKey[key][0].o].c);poly.setAttribute('fill-opacity','.2');}
 else{poly.setAttribute('fill','#000');poly.setAttribute('fill-opacity','0');}}
// 執行移動：selList=[{sid,nid}]；noFlip=過境不易主。回傳 {fac,cat,ok} 或 {err}
function doMove(srcKey,dstKey,selList,noFlip){seedForce();
 var bySid={};selList.forEach(function(x){(bySid[x.sid]=bySid[x.sid]||[]).push(x.nid);});
 var movedFac=null,movedCat=null,dest=[];
 Object.keys(bySid).forEach(function(sidS){var sid=+sidS,src=findStack(srcKey,sid);if(!src)return;if(!src.org)src.org=buildOrg(src.units);
  movedFac=src.fac;movedCat=src.cat;var nids=bySid[sidS];var whole=(nids.length===src.units.length&&src.units.length>0);
  var leaves=[];nids.forEach(function(nid){var lf=_findLeaf(src.org,nid);if(lf)leaves.push(lf);});if(!leaves.length)return;
  if(whole){removeStack(srcKey,sid);if(src.rank==='F'){src.rank='S';src.cmd=null;src.badge=null;}/*租界移出→轉普通列強部隊*/_repositionGen(src,dstKey);(src.attach||[]).forEach(function(a){_repositionGen(a,dstKey);});FORCE[dstKey]=FORCE[dstKey]||[];FORCE[dstKey].push(src);dest.push(src);}
  else{leaves.forEach(function(lf){_removeNode(src.org,lf.nid);});src.org=normalizeOrg(src.org,3);src.units=orgLeaves(src.org);
   var detRank=(src.rank==='S'||src.rank==='F')?'S':'D',detCmd=(src.rank==='S'||src.rank==='F')?null:src.cmd;var org=_wrapLeaves(leaves); // 租界(F)分兵移出＝普通列強無將領部隊
   var det={sid:++_sid,fac:src.fac,cmd:detCmd,rank:detRank,cat:src.cat,units:orgLeaves(org),org:org,attach:[],idle:false,flag:src.flag||'',badge:null};
   FORCE[dstKey]=FORCE[dstKey]||[];FORCE[dstKey].push(det);dest.push(det);}});
 if(!movedFac)return {err:'無可移動部隊'};
 dest.forEach(function(s){s.org=normalizeOrg(s.org,3);s.units=orgLeaves(s.org);});
 // 領地易主：沿移動路徑逐格翻牌（同陣營／同列強陣營不翻）；過境不易主則全部略過
 if(!noFlip&&movedCat==='land'){_movePath(srcKey,dstKey).forEach(function(ck){if(cells[ck]&&!_sameCamp(cells[ck].fac,movedFac)){cells[ck].fac=movedFac;_recolorHex(ck);}});}
 _recolorHex(dstKey);_recolorHex(srcKey);
 if(typeof rebuildGenIndex==='function')rebuildGenIndex();
 if(typeof buildGarrMarkers==='function')buildGarrMarkers();
 return {fac:movedFac,cat:movedCat,ok:true};}
window.__reachable=reachableSet;window.__doMove=doMove;window.__key2id=key2id;
// ---- 移動 UI ----
var _pmove=null;
function _moveInjectCSS(){if(typeof document==='undefined'||document.getElementById('movecss'))return;document.head.insertAdjacentHTML('beforeend','<style id="movecss">.hex.movehl{stroke:#ffd23e!important;stroke-width:2.6!important;stroke-opacity:1!important;}</style>');}
function _clearMoveHL(){if(typeof document==='undefined')return;var els=gHex?gHex.querySelectorAll('.hex.movehl'):[];[].slice.call(els).forEach(function(e){e.classList.remove('movehl');});}
function startMove(srcKey){_moveInjectCSS();var chips=info.querySelectorAll('.uchip.on');if(!chips.length){_toast('✗ 請先點選要移動的營／中隊',false);return;}
 var sel=[],cats={},bad=false,seaOnly=false;[].slice.call(chips).forEach(function(el){var st=el.closest('.ustack');if(!st)return;var s=findStack(srcKey,+st.getAttribute('data-sid'));if(s){cats[s.cat]=1;}var u=el.getAttribute('data-u');if(u==='驅'||u==='巡')seaOnly=true;sel.push({sid:+st.getAttribute('data-sid'),nid:+el.getAttribute('data-nid')});});
 if(Object.keys(cats).length>1){_toast('✗ 陸軍與海軍不可一起移動',false);return;}
 var cat=Object.keys(cats)[0]||'land';var fac=(FORCE[srcKey]&&FORCE[srcKey][0])?FORCE[srcKey][0].fac:null;
 var s0=findStack(srcKey,sel[0].sid);if(s0)fac=s0.fac;
 var reach=reachableSet(srcKey,fac,cat,seaOnly);var ks=Object.keys(reach);
 if(seaOnly&&!ks.length){_toast('✗ 驅逐艦／巡洋艦僅能於海域航行（不可入河川）',false);return;}
 if(!ks.length){_toast('✗ 無可移動格（超出里程／被敵軍或地形阻擋）',false);return;}
 _clearMoveHL();ks.forEach(function(k){var poly=gHex.querySelector('polygon[data-key="'+k+'"]');if(poly)poly.classList.add('movehl');});
 _pmove={srcKey:srcKey,fac:fac,cat:cat,sel:sel,reach:reach};_toast('▶ 點高亮格移動（點原格取消）',true);}
function _moveClick(key){var pm=_pmove;if(key===pm.srcKey){_pmove=null;_clearMoveHL();_toast('已取消移動',false);showGarrison(pm.srcKey);return;}
 if(!pm.reach[key]){_pmove=null;_clearMoveHL();_toast('✗ 該格不可移動（超出里程或有敵軍），已取消',false);return;}
 var noFlip=(typeof document!=='undefined'&&document.getElementById('_noflip'))?document.getElementById('_noflip').checked:false;
 var r=doMove(pm.srcKey,key,pm.sel,noFlip);_pmove=null;_clearMoveHL();
 if(r&&r.ok){_toast('✓ 已移動'+(noFlip?'（過境・地格不易主）':(r.cat==='land'?'（該格已劃歸我方）':'')),true);if(typeof render==='function')render();showGarrison(key);}
 else _toast('✗ 移動失敗',false);}
window.__startMove=startMove;
// ===== 運兵船載兵（§5.1：1 運兵船中隊載 2 旅＝10 營；沿岸／港口登陸；運輸途中被擊沉則載兵全滅 §7.6）=====
function _runCap(s){var n=0;(s.units||[]).forEach(function(u){if(u==='運')n++;});return n*10;}
function _cargoCount(s){return (s.cargo&&s.cargo.length)||0;}
// 裝載：把所選陸軍營裝上同格運兵船。回傳 null=成功，否則原因
function loadTransport(key,sel,transSid){seedForce();var trans=findStack(key,transSid);if(!trans||trans.cat!=='water')return '目標非水軍隊';
 var cap=_runCap(trans);if(cap<=0)return '該船隊沒有運兵船（運）';trans.cargo=trans.cargo||[];
 var bySid={};sel.forEach(function(x){(bySid[x.sid]=bySid[x.sid]||[]).push(x.nid);});
 var picked=[];Object.keys(bySid).forEach(function(sidS){var src=findStack(key,+sidS);if(!src||src.cat!=='land')return;if(!src.org)src.org=buildOrg(src.units);
   bySid[sidS].forEach(function(nid){var lf=_findLeaf(src.org,nid);if(lf)picked.push({u:lf.u,cmd:src.cmd,sid:+sidS,nid:nid});});});
 if(!picked.length)return '請先選取要裝載的陸軍營';
 if(trans.fac!==picked[0]&&false){}
 var badFac=picked.some(function(p){var s=findStack(key,p.sid);return s&&s.fac!==trans.fac&&!_sameCamp(s.fac,trans.fac);});
 if(badFac)return '僅能裝載同陣營陸軍';
 if(trans.cargo.length+picked.length>cap)return '運兵船載量不足（每運兵船中隊載 10 營；尚可載 '+(cap-trans.cargo.length)+' 營）';
 picked.forEach(function(p){var src=findStack(key,p.sid);_removeNode(src.org,p.nid);});
 Object.keys(bySid).forEach(function(sidS){var src=findStack(key,+sidS);if(!src)return;src.org=normalizeOrg(src.org,3);src.units=orgLeaves(src.org);
   if(src.units.length===0){if(src.rank==='G'&&!_isTopStack(key,+sidS))src.idle=true;else if((src.rank==='D'||src.rank==='S')&&_isTopStack(key,+sidS))removeStack(key,+sidS);}});
 picked.forEach(function(p){trans.cargo.push({u:p.u,cmd:p.cmd});});
 return null;}
function _canLand(key){if(!cells[key])return false;return _cellLandPass(key);} // 港口城市或陸地格皆可登陸
// 登陸：把運兵船上的載兵卸到 landKey（同格港口或相鄰陸地）。回傳 null=成功，否則原因
function unloadTransport(key,transSid,landKey){seedForce();var trans=findStack(key,transSid);if(!trans||!_cargoCount(trans))return '無載運部隊';
 landKey=landKey||key;if(!_canLand(landKey))return '登陸點須為陸地／港口';
 if(_enemyOcc(landKey,trans.fac,'land'))return '登陸點有敵軍，須先清除或改點（強行登陸＝戰鬥，Phase 4）';
 var byCmd={};trans.cargo.forEach(function(c){var kk=c.cmd||'';(byCmd[kk]=byCmd[kk]||[]).push(c.u);});
 Object.keys(byCmd).forEach(function(cmd){var org=buildOrg(byCmd[cmd]);
   var st={sid:++_sid,fac:trans.fac,cmd:cmd||null,rank:cmd?'D':'S',cat:'land',units:orgLeaves(org),org:org,attach:[],idle:false,flag:'',badge:null};
   FORCE[landKey]=FORCE[landKey]||[];FORCE[landKey].push(st);});
 trans.cargo=[];
 if(cells[landKey]&&!_sameCamp(cells[landKey].fac,trans.fac)){cells[landKey].fac=trans.fac;_recolorHex(landKey);}
 if(typeof buildGarrMarkers==='function')buildGarrMarkers();
 return null;}
window.__loadTransport=loadTransport;window.__unloadTransport=unloadTransport;window.__runCap=_runCap;
// 登陸目標選擇（開放水域＝點相鄰陸地格；港口＝可直接卸於本格）
var _pland=null;
function startLanding(key,transSid){var trans=findStack(key,transSid);if(!trans||!_cargoCount(trans)){_toast('✗ 該船無載運部隊',false);return;}
 var tgts={};var cr=key2cr(key);
 if(_canLand(key)&&!_enemyOcc(key,trans.fac,'land'))tgts[key]=true; // 本格為港口→可就地登陸
 nbrs(cr[0],cr[1]).forEach(function(n){var k=n[0]+','+n[1];if(cells[k]&&_canLand(k)&&!_enemyOcc(k,trans.fac,'land'))tgts[k]=true;});
 var ks=Object.keys(tgts);if(!ks.length){_toast('✗ 附近無可登陸的陸地／港口（或皆有敵軍）',false);return;}
 if(ks.length===1&&ks[0]===key){var r=unloadTransport(key,transSid,key);if(r){_toast('✗ '+r,false);}else{_toast('✓ 已於本格登陸',true);showGarrison(key);}return;}
 _moveInjectCSS();_clearMoveHL();ks.forEach(function(k){var poly=gHex.querySelector('polygon[data-key="'+k+'"]');if(poly)poly.classList.add('movehl');});
 _pland={srcKey:key,transSid:transSid,tgts:tgts};_toast('▶ 點高亮陸地格登陸（點原格取消）',true);}
function _landClick(key){var pl=_pland;if(!pl.tgts[key]){_pland=null;_clearMoveHL();_toast('✗ 該格不可登陸，已取消',false);return;}
 var r=unloadTransport(pl.srcKey,pl.transSid,key);_pland=null;_clearMoveHL();
 if(r){_toast('✗ '+r,false);}else{_toast('✓ 已登陸（'+((cells[key]&&cityCell[key])?cityCell[key].name:key)+'）',true);if(typeof render==='function')render();showGarrison(key);}}
window.__startLanding=startLanding;
function select(key){if(_pmove){_moveClick(key);return;}if(_pland){_landClick(key);return;}geoInfo(key);}
function renderInfo(k,ct,gps){if(!k){info.innerHTML=`<span class="big">中立／無主陸地</span><div class="gar">${gps||''}\n此格為陸地但未劃入任一勢力（邊陲）。</div>`;return;}
 const reg=R[k];let h=`<span class="big">${reg.flag?reg.flag+' ':''}${reg.n}</span><br><span class="tag" style="background:${reg.c}">${reg.g}</span>`;
 if(ct){const sl=slots(ct.lvl),used=ct.facs.length,free=sl-used,facTxt=used?ct.facs.map(l=>'Lv'+l).join('、'):'無';
  h+=`<span class="tag" style="background:#eee">${ct.port}</span>`;if(ct.conc)h+=`<span class="tag" style="background:#ffe08a">租界 ${ct.conc.join('')}</span>`;
  if(ct.port!=='內陸')h+=`<div class="gar" style="border-left:3px solid #5b86a6;padding-left:7px;margin-top:7px">⚓ <b>水陸雙棲</b>：本格陸面與水面之控制權<b>可分屬不同陣營</b>（§2.3b）。水面駐有敵方艦艇時，陸面即使已為我方所有，仍適用<b>河川禦敵規則</b>——我軍不得經此渡河或出入水道，亦不得使用港口機能（停泊、補給、造艦），須先擊沉敵艇。反之我方若亦駐有艦艇，敵方即無法取得本格水域，除非擊敗我水面部隊。<b>港口收入須水陸同屬一方、或佔領陸地且水域無敵人方可取得</b>；水面被敵控時港口加成歸零，僅剩城市基本收入。</div>`;
  h+=`<table>
   <tr><td class="k">城市</td><td>◉ ${ct.name}${ct.cap?' ★首府':''}</td></tr>
   <tr><td class="k">省份</td><td>${(cells[ct._key]&&cells[ct._key].prov)||'—'}</td></tr>
   <tr><td class="k">城市等級</td><td>Lv ${ct.lvl} / 5（每回合金錢 +${4+ct.lvl}）</td></tr>
   <tr><td class="k">工業槽</td><td>共 ${sl}｜已建 ${used}｜<b>剩餘 ${free}</b></td></tr>
   <tr><td class="k">現有工廠</td><td>${used} 座（${facTxt}）</td></tr>
   <tr><td class="k">港口</td><td>${ct.port}${ct.port==='海港'?'（可建海軍）':ct.port==='河港'?'（只可建砲艇）':''}</td></tr>
   ${ct.port!=='內陸'?`<tr><td class="k">城防槽</td><td>共 ${sl} 個｜可建 ${ct.dual?'江防＋海防砲台（河海雙棲）':ct.port==='海港'?'海防砲台':'江防砲台'}（§4.7）</td></tr>`:''}
   <tr><td class="k">租界</td><td>${ct.conc?ct.conc.join(' ')+'（外購折價・免大規模黑幫）':'無'}</td></tr>
  </table><div class="gar">${gps?gps+'\n':''}${stripForce(ct.note)}</div>`;
 } else { h+=`<div class="gar">${gps||''}\n屬 ${reg.n}。此格無主要城市。</div>`; }
 info.innerHTML=h;}
// ===== 圖例 =====
const groups={'玩家四強':[],'中國NPC':[],'列強':[]};for(const k in R){const g=R[k].g==='玩家'?'玩家四強':R[k].g;groups[g].push(k);}
let lh='';for(const gn in groups){lh+=`<h3>${gn}</h3>`;groups[gn].forEach(k=>{lh+=`<div class="lg"><span class="sw" style="background:${R[k].c}"></span>${R[k].flag?R[k].flag+' ':''}${R[k].n}</div>`;});}
lh+=`<h3>其他</h3><div class="lg"><span class="sw" style="background:#c7d2c0"></span>海洋</div><div class="lg"><span class="sw" style="background:#5b86a6"></span>河川（長江/黃河/珠江）</div><div class="lg"><span class="sw" style="background:repeating-linear-gradient(90deg,#2b2113 0 2px,#f0e6ce 2px 4px)"></span>中國鐵路（自由使用）</div><div class="lg"><span class="sw" style="background:repeating-linear-gradient(90deg,#8c1c13 0 2px,#ffd9d2 2px 4px)"></span>列強鐵路（需關係 ≥5）</div><div class="lg"><span class="sw" style="background:#e7dcbe"></span>復古底圖陸地</div><div class="lg"><span class="sw" style="background:transparent;color:#ffd23e;font-size:12px;text-align:center;line-height:13px">★</span>首都（動態；隨遷都移動）</div><div class="lg"><span class="sw" style="background:#546e7a;border-radius:2px"></span>兵力點（非城市駐軍方塊；城市駐軍見城市之「查看駐軍」）</div>`;
document.getElementById('legend').innerHTML=lh;
// ===== 平移縮放 / 切換 =====
let scale=1,tx=0,ty=0,drag=false,pxv,pyv,moved=false;
function apply(){vp.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`);}
const mz=document.getElementById('mapzone');
mz.addEventListener('mousedown',e=>{drag=true;moved=false;pxv=e.clientX;pyv=e.clientY;mz.classList.add('grabbing');});
window.addEventListener('mouseup',()=>{drag=false;mz.classList.remove('grabbing');});
window.addEventListener('mousemove',e=>{if(!drag)return;const dx=e.clientX-pxv,dy=e.clientY-pyv;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;tx+=dx;ty+=dy;pxv=e.clientX;pyv=e.clientY;apply();});
mz.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY<0?1.12:0.89;scale=Math.min(9,Math.max(0.35,scale*f));apply();},{passive:false});
document.getElementById('zin').onclick=()=>{scale=Math.min(9,scale*1.2);apply();};
document.getElementById('zout').onclick=()=>{scale=Math.max(0.35,scale*0.83);apply();};
document.getElementById('zreset').onclick=()=>{scale=1;tx=0;ty=0;apply();};
document.getElementById('tgnum').addEventListener('change',e=>{gNum.style.display=e.target.checked?'block':'none';});
document.getElementById('tgprov').addEventListener('change',e=>{const d=e.target.checked?'block':'none';gProv.style.display=d;gPName.style.display=d;});
document.getElementById('tgrail').addEventListener('change',e=>{gRail.style.display=e.target.checked?'block':'none';});
document.getElementById('tggen').addEventListener('change',e=>{gGen.style.display=e.target.checked?'block':'none';});
document.getElementById('tgtint').addEventListener('change',e=>{gHex.querySelectorAll('polygon').forEach(p=>{const cc=cells[p.dataset.key];if(cc.river)return;if(!e.target.checked){p.setAttribute('fill-opacity','0');}else if(cc.fac){p.setAttribute('fill-opacity',cc.land?(R[cc.fac].g==='列強'?'.42':'.35'):'.26');}});});
document.getElementById('tghex').addEventListener('change',e=>{gHex.style.stroke='';gHex.querySelectorAll('polygon').forEach(p=>{p.style.strokeOpacity=e.target.checked?'':'0';});});
</script>
