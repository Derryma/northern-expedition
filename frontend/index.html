<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>北伐風雲 Northern Expedition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- Top Bar -->
  <header class="game-topbar">
    <div class="topbar-left">
      <h1 class="game-title">北伐風雲</h1>
      <span class="turn-indicator" id="turnBadge">回合 1</span>
    </div>
    <div class="topbar-center">
      <button class="topbar-btn" data-panel="generals">將領樹</button>
      <button class="topbar-btn" data-panel="recruitment">募兵</button>
      <button class="topbar-btn" data-panel="loans">借款</button>
      <button class="topbar-btn" data-panel="foreign">外交</button>
      <button class="topbar-btn feature-cards" data-panel="cards">手牌</button>
    </div>
    <div class="topbar-right">
      <div class="faction-stats" id="factionStats" aria-label="陣營資源"></div>
      <select id="playerSelect" class="faction-select"></select>
      <button id="newGame" class="topbar-btn topbar-icon-btn" title="重新開始" aria-label="重新開始">↺</button>
    </div>
  </header>

  <!-- Main Map -->
  <main class="map-container">
    <div class="map-stage" id="mapStage">
      <canvas id="mapCanvas" width="1800" height="1200"></canvas>
      <svg id="armyOverlay" width="1800" height="1200" aria-label="軍隊標記"></svg>
    </div>
  </main>
  <div class="map-zoom-controls" aria-label="地圖縮放">
    <button id="zoomOut" title="縮小" aria-label="縮小">−</button>
    <input id="zoomRange" type="range" min="60" max="200" step="10" value="100" aria-label="地圖縮放比例">
    <button id="zoomIn" title="放大" aria-label="放大">+</button>
    <button id="zoomReset" title="重設縮放" aria-label="重設縮放">↺</button>
  </div>

  <!-- Phase Banner (top overlay) -->
  <div class="phase-banner" id="phaseBanner">
    <span class="phase-label">回合制策略</span>
  </div>

  <aside class="tile-info-dock" id="tileInfoDock" aria-label="地格情報">
    <div class="tile-info" id="tileInfo" hidden></div>
  </aside>

  <aside class="battle-report-dock" id="battleReportDock" aria-label="戰鬥情報">
    <div class="battle-panel" id="battlePanel" hidden></div>
  </aside>

  <!-- Pending unit orders and turn notifications -->
  <aside class="turn-dock" id="turnDock" aria-label="待命軍隊">
    <button class="inbox-badge" id="dealInboxBadge" title="待處理交易" aria-label="待處理交易" hidden>0</button>
    <div class="dock-faction" id="dockFaction" aria-label="目前陣營"></div>
    <div class="dock-header">
      <span id="pendingTitle">待命軍隊</span>
      <span class="dock-count" id="pendingCount">0</span>
    </div>
    <div class="army-detail" id="armyDetail" hidden></div>
    <div class="pending-list" id="pendingList"></div>
    <div class="turn-notification" id="turnNotification" hidden></div>
    <div class="turn-dock-actions">
      <button class="undo-order-btn" id="undoOrderBtn" title="撤銷本回合上一道軍令" disabled>↶</button>
      <button class="debug-turn-btn" id="debugForceTurnBtn" title="Debug：強制進入下一回合" hidden>DBG</button>
      <button class="event-history-btn feature-events" id="eventHistoryBtn">
        <span class="event-badge" id="eventBadge">!</span>
        <span>事件</span>
      </button>
      <button class="end-turn-btn" id="endTurnBtn">
        <span id="endTurnLabel">處理軍令</span>
        <span class="turn-arrow">→</span>
      </button>
    </div>
  </aside>

  <div class="ui-tooltip" id="uiTooltip" role="tooltip" hidden></div>

  <!-- Overlay Panels (hidden by default) -->
  <div class="overlay-panel panel-large" id="panelGenerals">
    <div class="panel-header">
      <h2>將領樹</h2>
      <button class="panel-close" data-close="generals">×</button>
    </div>
    <div class="panel-content" id="generalsContent"></div>
  </div>

  <div class="overlay-panel" id="panelRecruitment">
    <div class="panel-header">
      <h2>募兵徵將</h2>
      <button class="panel-close" data-close="recruitment">×</button>
    </div>
    <div class="panel-content" id="recruitmentContent"></div>
  </div>

  <div class="overlay-panel" id="panelLoans">
    <div class="panel-header">
      <h2>借款</h2>
      <button class="panel-close" data-close="loans">×</button>
    </div>
    <div class="panel-content" id="loansContent"></div>
  </div>

  <div class="overlay-panel" id="panelForeign">
    <div class="panel-header">
      <h2>列強外交</h2>
      <button class="panel-close" data-close="foreign">×</button>
    </div>
    <div class="panel-content" id="foreignContent"></div>
  </div>

  <div class="overlay-panel" id="panelCards">
    <div class="panel-header">
      <h2>功能卡</h2>
      <button class="panel-close" data-close="cards">×</button>
    </div>
    <div class="panel-content" id="cardsContent"></div>
  </div>

  <!-- Event Modal -->
  <div class="event-modal" id="eventModal">
    <div class="event-modal-content">
      <h2>本回合世界事件</h2>
      <div class="event-card-display" id="eventCardDisplay"></div>
      <button class="event-modal-close" id="eventModalClose">明白了</button>
    </div>
  </div>

  <!-- Event History Panel -->
  <div class="overlay-panel" id="panelEventHistory">
    <div class="panel-header">
      <h2>事件歷史</h2>
      <button class="panel-close" data-close="eventHistory">×</button>
    </div>
    <div class="panel-content" id="eventHistoryContent"></div>
  </div>

  <script type="module" src="/map.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
