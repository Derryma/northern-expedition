<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>北伐風雲 Playtest Board</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <h1>北伐風雲</h1>
        <p id="statusLine">戰略地圖載入中</p>
      </div>
      <nav class="board-tabs" aria-label="Board views">
        <button class="tab active" data-board="/pj/北伐風雲_整合遊戲介面.html">整合戰棋</button>
        <button class="tab" data-board="/pj/北伐風雲_地圖.html">戰略地圖</button>
        <button class="tab" data-board="/pj/北伐風雲_陣營操作板.html">陣營操作板</button>
        <button class="tab" data-board="/pj/北伐風雲_事件卡.html">事件卡池</button>
      </nav>
      <div class="turn-tools">
        <button id="newGame" title="重開新局">↺</button>
        <button id="nextTurn" class="primary" title="進入下一回合">下一回合</button>
        <select id="playerSelect" title="抽取功能卡玩家"></select>
        <button id="drawFunction" title="抽功能卡">抽功能</button>
        <button id="drawEvent" title="抽事件卡">抽事件</button>
      </div>
    </header>

    <main class="board-layout">
      <section class="board-stage" aria-label="Playable board">
        <iframe id="boardFrame" title="北伐風雲 board" src="/pj/北伐風雲_整合遊戲介面.html"></iframe>
      </section>

      <aside class="command-rail">
        <section class="rail-panel current-event">
          <div class="panel-title">
            <h2>本回合事件</h2>
            <span id="turnBadge">回合 0</span>
          </div>
          <article id="eventCard" class="event-card empty">尚未抽事件。按「下一回合」會自動抽世界事件並為各玩家抽功能卡。</article>
        </section>

        <section class="rail-panel faction-strip">
          <div class="panel-title">
            <h2>玩家手牌</h2>
            <span id="poolMeta">-</span>
          </div>
          <div id="hands" class="hands"></div>
        </section>

        <section class="rail-panel force-tools">
          <div class="panel-title">
            <h2>戰鬥快算</h2>
            <button id="runCombat" title="Run combat">執行</button>
          </div>
          <div class="combat-grid">
            <label>A 軍 JSON<textarea id="armyA" spellcheck="false"></textarea></label>
            <label>B 軍 JSON<textarea id="armyB" spellcheck="false"></textarea></label>
          </div>
          <pre id="combatResult">等待戰鬥輸入。</pre>
        </section>
      </aside>
    </main>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
