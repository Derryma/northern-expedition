 return `<div class="board">
  <div class="bhead"><div class="flag">${FLAG[f.flag]}</div><h2>${f.name}</h2>
   <span class="tag" style="background:${f.color}">總兵力 ${landCount(f)+joinedLand(fk)+navyCount(f)}（陸 ${landCount(f)+joinedLand(fk)}＋水 ${navyCount(f)}）${joinedLand(fk)?`｜含在野投效 ${joinedLand(fk)}`:''}</span></div>
  <div class="sec"><h3>領袖與將領（部隊以「營」為單位）</h3><div class="ppl">${f.people.map((p,i)=>person('ST',fk,p,i)).join('')}${joinedTo(fk).map(o=>poolJoinCard(o.p,o.i)).join('')}</div></div>
  <div class="sec"><h3>水軍（中隊）</h3><div class="tr">${navy}</div>
   ${(()=>{const na=f.people.filter(p=>advActive(p)&&ADVEFF[p.adv]&&ADVEFF[p.adv].naval);
     if(!na.length)return '';
     return `<div style="margin-top:7px;font-size:11.5px;line-height:1.5;color:#7fc8e8;background:#12100a;border:1px solid #33291a;border-left:3px solid #5b86a6;border-radius:6px;padding:6px 8px">
      ⚓ <b>海軍顧問加成生效中</b>：${na.map(p=>`${p.adv}（掛於 <b>${p.n}</b>${String(p.rank).includes('領袖')?'・領袖統籌全軍艦隊':''}，剩 ${p.advT} 回合）`).join('；')}<br>
      → 全軍海軍／艦砲命中 +1；該將所在港口城市每回合金錢 +1</div>`;})()}
  </div>
  <div class="sec"><h3>經濟</h3><div class="eco">${eco}</div></div>
  <div class="sec"><h3>列強銀行貸款方案（依關係自動判定・§4.5）</h3>
   <table class="bank"><tr><th>銀行</th><th>關係</th><th>可用方案</th></tr>${bank}
   <tr><td>🇷🇺 （蘇聯）</td><td style="text-align:center">${f.rel.蘇}</td><td class="no">不承作商業放款</td></tr></table></div>
  <div class="sec"><h3>列強關係（-15 ～ 15）</h3><div class="rel">${rel}</div></div>
  <div class="hint" style="padding:8px 0 0">${f.note}</div></div>`;
}
function npcBoard(k){
 const f=NPC[k];
 return `<div class="board ${AV[k]?'':'dead'}" id="npc_${k}">
  <div class="bhead"><div class="flag">${FLAG[f.flag]}</div><h2>${f.name}</h2>
   <span class="tag" style="background:#78909c">總兵力 ${landCount(f)+joinedLand(k)+navyCount(f)}${navyCount(f)?`（陸 ${landCount(f)+joinedLand(k)}＋水 ${navyCount(f)}）`:' 營'}${joinedLand(k)?`｜含在野投效 ${joinedLand(k)}`:''}</span>
   <label style="font-size:11.5px"><input type="checkbox" class="avin" data-k="${k}" ${AV[k]?'checked':''}> 在場</label></div>
  <div class="sec"><div class="ppl">${f.people.map((p,i)=>person('NPC',k,p,i)).join('')}${joinedTo(k).map(o=>poolJoinCard(o.p,o.i)).join('')}</div></div>
  <div class="sec"><h3>與列強關係（影響事件觸發・§8.4C）</h3><div class="rel">
   ${Object.keys(NPCREL[k]).map(lab=>`<div><span>${FLAGEMO[lab]}</span>
     <input type="number" min="-15" max="15" value="${NPCREL[k][lab]}" data-k="${k}" data-r="${lab}" class="nrin"
     style="color:${NPCREL[k][lab]>0?'#9ccc65':NPCREL[k][lab]<0?'#ef5350':'#f3ecdb'}"><small>${lab}</small></div>`).join('')}
  </div></div>
  <div class="hint" style="padding:8px 13px">${f.note}</div></div>`;
}
function poolBoard(){
 const opts=['','奉系','直系','孫傳芳','國民革命軍','晉系','西北軍','湘軍','川軍','滇系','馬家軍'];
 // 已投效者已移入其陣營板；此處僅列仍在池中或已陣亡者
 const cards=POOL.map((p,i)=>({p,i})).filter(o=>!o.p.out).map(({p,i})=>{
  const gone=p.dead;
  const troops=Object.keys(p.t).filter(u=>p.t[u]>0).map(u=>`${u}×${p.t[u]}`).join(' ')||'無';
  return `<div class="per ${gone?'dead':''}" style="background:var(--pnl2)">
   ${pic(p.n)}
   <div class="pinfo">
    <div class="pname">${p.n}<span class="rk">在野</span>${p.dead?'<span class="rk" style="background:#7a2a2a;color:#fff">已陣亡/處決</span>':''}</div>
    <div class="stat">忠誠 <b>${p.loy}</b>　身價 <b>${p.val}</b> 元　自帶部隊 <b>${troops}</b></div>
    <div class="abil">${p.bg}</div>
    <div class="abil" style="color:#e8c07d">${p.ab}</div>
    <div class="adv">出山投效
      <select data-i="${i}" class="poolout">${opts.map(o=>`<option value="${o}" ${p.out===o?'selected':''}>${o||'（仍在池中）'}</option>`).join('')}</select>
      <label style="font-size:11px"><input type="checkbox" class="pooldead" data-i="${i}" ${p.dead?'checked':''}> 已陣亡／處決</label>
    </div>
   </div></div>`;}).join('');
 const joined=POOL.map((p,i)=>({p,i})).filter(o=>o.p.out&&!o.p.dead);
 const joinedNote=joined.length?`<div class="hint" style="padding:6px 13px 0;color:#9ccc65">已投效並移入陣營板：${joined.map(o=>`${o.p.n}→${o.p.out}`).join('、')}</div>`:'';
 const left=POOL.filter(p=>!p.out&&!p.dead).length;
 return `<div class="board npcwrap">
  <div class="bhead"><div class="flag">${FLAG.wuse}</div><h2>在野將領池（§10.7）</h2>
   <span class="tag" style="background:#8d6e63">池中尚有 ${left} / ${POOL.length} 人</span></div>
  <div class="hint" style="padding:8px 13px 0">已下野、待出山的宿將，不屬於任何勢力。經《舊部來投》（隨機）或《在野名將投效》（指定並付半價）出山，出山即帶自有部隊加入該陣營，且<b>一局限出山一次</b>。池空時該事件改為獲步兵 ×2。<b>選定投效陣營後，該將領即自本池移入該陣營操作板</b>。</div>
  ${joinedNote}
  <div class="sec"><div class="ppl">${cards||'<div class="hint" style="padding:4px 13px">在野池已空（全部投效或陣亡）。</div>'}</div></div></div>`;
}
// 列強將領（§12.6）
const POWGEN=[
 {n:'武藤信義',f:'jp',role:'關東軍司令官',ab:'關東軍統帥：所部步兵近戰命中 +1；每回合可指定 3 單位額外行動一次（奇襲）。'},
 {n:'森岡守成',f:'jp',role:'朝鮮軍司令官',ab:'朝鮮軍：於朝鮮本土作戰時，所部步兵近戰傷害 +1。'},
 {n:'安滿欽一',f:'jp',role:'第三師團長（駐名古屋）',ab:'天皇陛下萬歲：所部步兵與騎兵近戰命中 +1；每回合可指定 3 單位額外行動一次（奇襲）。'},
 {n:'伯德伍德',f:'uk',role:'印度英軍總司令 William Birdwood',ab:'帝國陸軍：所部步兵射擊命中 +1；坦克單位攻城時攻擊 +1。'},
 {n:'金文泰',f:'uk',role:'香港總督 Sir Cecil Clementi',ab:'天佑吾皇：於租界城市以及香港守備時，所部生命 +1 且艦砲支援命中 +1。'},
 {n:'布留赫爾',f:'su',role:'加倫將軍 Vasily Blyukher',ab:'紅軍教頭：所部砲兵命中 +1；同場坦克與步兵各 ≥2 時全體命中 +1。'},
 {n:'倫納德·伍德',f:'us',role:'菲律賓總督 Leonard Wood',ab:'參謀典範：所部機槍兵射擊命中 +1（美軍不派正規軍軍援，僅自衛／懲戒時生效）。'},
 {n:'瓦倫',f:'fr',role:'法屬印度支那總督 Alexandre Varenne',ab:'殖民地總督：外籍兵團步兵近戰命中再 +1；於印度支那本土防衛時全體生命 +1。'},
];
function powGenBoard(){
 const cards=POWGEN.map(g=>`<div class="per" style="background:var(--pnl2)">
   ${pic(g.n)}
   <div class="pinfo">
    <div class="pname">${g.n}<span class="rk" style="background:#455a64;color:#fff">列強將領</span></div>
    <div class="stat"><span style="display:inline-block;width:24px;height:16px;vertical-align:-3px;border:1px solid #0008;margin-right:5px">${FLAG[g.f]}</span>${g.role}</div>
    <div class="abil" style="color:#e8c07d">${g.ab}</div>
   </div></div>`).join('');
 return `<div class="board npcwrap">
  <div class="bhead"><div class="flag">${FLAG.jp}</div><h2>列強將領（§12.6）</h2>
   <span class="tag" style="background:#455a64">不可策反／招降／暗殺</span></div>
  <div class="hint" style="padding:8px 13px 0">只統帥該列強部隊，不能指揮中國軍隊，也不會借給玩家。<b>被俘後僅能軟禁或處決</b>——軟禁保留和談空間；<b>處決視同向該列強宣戰</b>，觸發 §11.7(A) 不可停止的全面報復。</div>
  <div class="sec"><div class="ppl">${cards}</div></div></div>`;
}
function powerBoard(){
 const rows=[['jp','日本','關東軍・朝鮮軍・台灣軍・第三師團；海軍最強'],['su','蘇聯','遠東紅軍・外蒙駐軍；坦克與重砲，不放款'],
  ['uk','英國','英屬香港（在華砲艇／遠東艦隊）・印緬陸軍'],['us','美國','駐菲陸軍・亞洲艦隊；唯一不派正規軍軍援'],
  ['fr','法國','法屬印度支那・外籍兵團'],['de','德國（威瑪共和）','無駐軍；僅售特色武器與派顧問（政治中立）']];
 return `<div class="board npcwrap"><div class="bhead"><div class="flag">${FLAG.uk}</div><h2>列強一覽</h2>
   <span class="tag" style="background:#455a64">關係值於各陣營面板調整</span></div>
  <div class="sec" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px">
   ${rows.map(([k,n,d])=>`<div style="background:var(--pnl2);border:1px solid #33291a;border-radius:9px;padding:9px">
    <h4 style="margin:0 0 5px;font-size:13.5px;display:flex;align-items:center;gap:7px"><span style="width:26px;height:17px;display:inline-block;border:1px solid #0008">${FLAG[k]}</span>${n}</h4>
    <div class="abil">${d}</div></div>`).join('')}</div></div>`;
}
function render(){
 document.getElementById('wrap').innerHTML=
  Object.keys(ST).map(board).join('')+
  `<div class="board npcwrap"><div class="bhead"><div class="flag">${FLAG.wuse}</div><h2>NPC 勢力（取消「在場」＝已被消滅，事件卡同步失效）</h2></div></div>`+
  Object.keys(NPC).map(npcBoard).join('')+poolBoard()+powGenBoard()+powerBoard();
 bind();
}
function pickObj(s,f){return s==='ST'?ST[f]:s==='POOL'?{people:POOL}:NPC[f];}
function bind(){
 document.querySelectorAll('.tin').forEach(el=>el.onchange=e=>{const d=e.target.dataset;pickObj(d.s,d.f).people[d.p].t[d.u]=+e.target.value;render();});
 document.querySelectorAll('.win').forEach(el=>el.onchange=e=>{const d=e.target.dataset;pickObj(d.s,d.f).people[d.p].wr[d.w]=+e.target.value;render();});
 document.querySelectorAll('.loyin').forEach(el=>el.onchange=e=>{const d=e.target.dataset;pickObj(d.s,d.f).people[d.p].loy=Math.max(0,Math.min(10,+e.target.value));render();});
 document.querySelectorAll('.loyrst').forEach(el=>el.onclick=e=>{const d=e.target.dataset,p=pickObj(d.s,d.f).people[d.p];if(p.loy0!==undefined)p.loy=p.loy0;render();});
 document.querySelectorAll('.nin').forEach(el=>el.onchange=e=>{const d=e.target.dataset;ST[d.f].navy[d.n]=+e.target.value;});
 document.querySelectorAll('.ein').forEach(el=>el.onchange=e=>{const d=e.target.dataset;ST[d.f].eco[d.e]=+e.target.value;});
 document.querySelectorAll('.rin').forEach(el=>el.onchange=e=>{const d=e.target.dataset;ST[d.f].rel[d.r]=Math.max(-15,Math.min(15,+e.target.value));render();});
 document.querySelectorAll('.ain').forEach(el=>el.onchange=e=>{const d=e.target.dataset,p=pickObj(d.s,d.f).people[d.p];
   p.adv=e.target.value;if(e.target.value!=='—'&&!p.advT)p.advT=10;if(e.target.value==='—')p.advT=0;render();});
 document.querySelectorAll('input.t').forEach(el=>el.onchange=e=>{const d=e.target.dataset;pickObj(d.s,d.f).people[d.p].advT=+e.target.value;});
 document.querySelectorAll('.addsp').forEach(el=>el.onclick=e=>{const d=e.target.dataset,box=e.target.parentNode;
   const nm=box.querySelector('.nm').value.trim(),q=+box.querySelector('.q').value||1;if(!nm)return;
   const p=pickObj(d.s,d.f).people[d.p];(p.sp=p.sp||[]).push({n:nm,q});render();});
 document.querySelectorAll('.spq').forEach(el=>el.onchange=e=>{const d=e.target.dataset,p=pickObj(d.s,d.f).people[d.p];
   const q=+e.target.value;if(q<=0)p.sp.splice(+d.j,1);else p.sp[+d.j].q=q;render();});
 document.querySelectorAll('.rmsp').forEach(el=>el.onclick=e=>{const d=e.target.dataset;
   pickObj(d.s,d.f).people[d.p].sp.splice(+d.j,1);render();});
 document.querySelectorAll('.nrin').forEach(el=>el.onchange=e=>{const d=e.target.dataset;
   NPCREL[d.k][d.r]=Math.max(-15,Math.min(15,+e.target.value));render();});
 document.querySelectorAll('.poolout').forEach(el=>el.onchange=e=>{POOL[+e.target.dataset.i].out=e.target.value;render();});
 document.querySelectorAll('.pooldead').forEach(el=>el.onchange=e=>{POOL[+e.target.dataset.i].dead=e.target.checked;render();});
 document.querySelectorAll('.avin').forEach(el=>el.onchange=e=>{AV[e.target.dataset.k]=e.target.checked;
   document.getElementById('npc_'+e.target.dataset.k).classList.toggle('dead',!e.target.checked);});
}
// ================= 存檔 =================
const KEY='beifa_dashboard_v2';
const snap=()=>({ST,NPC,CNREL,AV,NPCREL,POOL});
document.getElementById('save').onclick=()=>{try{localStorage.setItem(KEY,JSON.stringify(snap()));alert('已儲存到瀏覽器。');}
 catch(e){alert('此瀏覽器不允許本機儲存，請改用「匯出 JSON」。');}};
document.getElementById('load').onclick=()=>{try{const d=localStorage.getItem(KEY);if(!d)return alert('沒有找到存檔。');
 const o=JSON.parse(d);ST=o.ST;NPC=o.NPC||NPC;CNREL=o.CNREL;AV=o.AV;NPCREL=o.NPCREL||NPCREL;POOL=o.POOL||POOL;render();}catch(e){alert('讀取失敗。');}};
document.getElementById('exp').onclick=()=>{const b=new Blob([JSON.stringify(snap(),null,1)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='北伐風雲_戰況.json';a.click();};
document.getElementById('imp').onclick=()=>document.getElementById('file').click();
document.getElementById('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{const o=JSON.parse(r.result);ST=o.ST;NPC=o.NPC||NPC;CNREL=o.CNREL;AV=o.AV;NPCREL=o.NPCREL||NPCREL;POOL=o.POOL||POOL;render();}catch(x){alert('檔案格式錯誤。');}};r.readAsText(f);};
document.getElementById('reset').onclick=()=>{if(confirm('確定重設為開局狀態？')){fresh();render();}};
render();
</script>
</body>
</html>
